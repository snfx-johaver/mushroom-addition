<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title description">
  <title id="title">Energy Insights and Purchases synthetic example</title>
  <desc id="description">Two separate tab illustrations: measured midnight-to-noon household use and grid purchases on the left; independently supplied upcoming purchase allocations and consumer forecasts on the right. All figures are invented. Battery input is separate from household consumption.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #25313c; font-size: 12px; }
      .muted { fill: #647386; } .small { font-size: 11px; } .heading { font-size: 17px; font-weight: 700; }
      .label { font-weight: 700; } .value { font-size: 20px; font-weight: 700; } .line { stroke: #e3e8ed; }
    </style>
  </defs>
  <rect width="1120" height="850" fill="#f1f3f6"/>
  <text x="24" y="29" class="muted">Two tab states shown side by side / synthetic illustration, not a live screenshot</text>
  <rect x="18" y="44" width="534" height="758" rx="18" fill="#fff" stroke="#dce1e7"/>
  <rect x="568" y="44" width="534" height="758" rx="18" fill="#fff" stroke="#dce1e7"/>
  <g>
    <circle cx="51" cy="79" r="18" fill="#e1f3ef"/><path d="m52 66-9 15h8l-2 11 11-17h-9z" fill="#168879"/>
    <text x="80" y="77" class="heading">Energy Insights &amp; Purchases</text><text x="80" y="96" class="muted small">Synthetic metered snapshot</text>
    <rect x="38" y="114" width="494" height="34" rx="9" fill="#f2f5f7"/><rect x="40" y="116" width="245" height="30" rx="8" fill="#dff2ed"/>
    <text x="110" y="136" fill="#168879" class="label">Today so far</text><text x="353" y="136" class="muted">Upcoming plan</text>
    <text x="38" y="172" class="muted small">Measured window: 00:00-12:00</text>
    <rect x="38" y="186" width="118" height="65" rx="10" fill="#f2f5f7"/><text x="49" y="207" class="muted small">Home</text><text x="49" y="234" class="value">12 kWh</text>
    <rect x="164" y="186" width="118" height="65" rx="10" fill="#fff7df"/><text x="175" y="207" class="muted small">Solar</text><text x="175" y="234" class="value">8 kWh</text>
    <rect x="290" y="186" width="118" height="65" rx="10" fill="#f2eafb"/><text x="301" y="207" class="muted small">Grid import</text><text x="301" y="234" class="value">8 kWh</text>
    <rect x="416" y="186" width="116" height="65" rx="10" fill="#edf7f3"/><text x="427" y="207" class="muted small">Battery input</text><text x="427" y="234" class="value">1 kWh</text>
    <text x="38" y="278" class="small">Home 1.1 kW / Solar 2.8 kW / Grid 0 kW</text>
    <text x="38" y="299" class="muted small">Home self-powered now</text><text x="532" y="299" text-anchor="end" class="label">100%</text>
    <rect x="38" y="309" width="494" height="5" rx="2" fill="#168879"/>
    <text x="38" y="346" class="heading">Where your energy goes</text>
    <text x="38" y="369" class="muted small">Sort: Energy / Active only: off</text>
    <g>
      <circle cx="48" cy="399" r="5" fill="#e8a052"/><text x="62" y="403">Heat pump</text><text x="270" y="403" text-anchor="end" class="label">6 kWh</text>
      <rect x="62" y="414" width="200" height="4" rx="2" fill="#f5f0e9"/><rect x="62" y="414" width="100" height="4" rx="2" fill="#e8a052"/>
      <text x="62" y="433" class="muted small">720 W / 50% / +0.4 kWh vs plan</text>
      <circle cx="48" cy="461" r="5" fill="#9670c5"/><text x="62" y="465">EV charger</text><text x="270" y="465" text-anchor="end" class="label">3 kWh</text>
      <rect x="62" y="476" width="200" height="4" rx="2" fill="#f1ecf7"/><rect x="62" y="476" width="50" height="4" rx="2" fill="#9670c5"/>
      <text x="62" y="495" class="muted small">0 W / 25% / On plan</text>
      <circle cx="48" cy="523" r="5" fill="#5b97cd"/><text x="62" y="527">Other home</text><text x="270" y="527" text-anchor="end" class="label">3 kWh</text>
      <text x="62" y="550" class="muted small">380 W / 25% / On plan</text>
      <circle cx="421" cy="446" r="65" fill="none" stroke="#e8a052" stroke-width="24"/>
      <circle cx="421" cy="446" r="65" fill="none" stroke="#9670c5" stroke-width="24" stroke-dasharray="102.1 306.3" transform="rotate(90 421 446)"/>
      <circle cx="421" cy="446" r="65" fill="none" stroke="#5b97cd" stroke-width="24" stroke-dasharray="102.1 306.3" transform="rotate(180 421 446)"/>
      <text x="421" y="443" text-anchor="middle" class="value">12 kWh</text><text x="421" y="465" text-anchor="middle" class="muted small">Home use</text>
    </g>
    <text x="38" y="579" class="muted small">Home consumers exclude battery input. No device-cost estimates.</text>
    <path d="M38 595h494" class="line"/>
    <text x="38" y="622" class="heading">What you bought, at what price</text>
    <g class="small"><text x="38" y="648" class="muted">Unit price</text><text x="275" y="648" class="muted">Import</text><text x="515" y="648" text-anchor="end" class="muted">Cost</text>
      <text x="38" y="673">EUR 0.15/kWh</text><text x="275" y="673">5 kWh</text><text x="515" y="673" text-anchor="end">EUR 0.75</text>
      <text x="38" y="698">EUR 0.25/kWh</text><text x="275" y="698">3 kWh</text><text x="515" y="698" text-anchor="end">EUR 0.75</text>
      <text x="38" y="726" class="muted">Metered intervals / weighted import price EUR 0.1875/kWh</text>
    </g>
    <rect x="38" y="744" width="494" height="38" rx="8" fill="#edf7f3"/><text x="50" y="768" class="label">EUR 1.26 net spend / EUR 1.50 import - EUR 0.24 export</text>
  </g>
  <g>
    <circle cx="601" cy="79" r="18" fill="#e1f3ef"/><path d="m602 66-9 15h8l-2 11 11-17h-9z" fill="#168879"/>
    <text x="630" y="77" class="heading">Energy Insights &amp; Purchases</text><text x="630" y="96" class="muted small">Independent supplied forecast</text>
    <rect x="588" y="114" width="494" height="34" rx="9" fill="#f2f5f7"/><rect x="835" y="116" width="245" height="30" rx="8" fill="#dff2ed"/>
    <text x="660" y="136" class="muted">Today so far</text><text x="903" y="136" class="label">Upcoming plan</text>
    <text x="588" y="172" class="muted small">Upcoming 24 hours / supplied plan, not measured or executed</text>
    <rect x="588" y="186" width="158" height="65" rx="10" fill="#f2f5f7"/><text x="599" y="207" class="muted small">Home forecast</text><text x="599" y="234" class="value">28.6 kWh</text>
    <rect x="756" y="186" width="158" height="65" rx="10" fill="#fff7df"/><text x="767" y="207" class="muted small">Solar forecast</text><text x="767" y="234" class="value">13.6 kWh</text>
    <rect x="924" y="186" width="158" height="65" rx="10" fill="#edf7f3"/><text x="935" y="207" class="muted small">Planned purchases</text><text x="935" y="234" class="value">12.1 kWh</text>
    <text x="588" y="284" class="heading">Upcoming grid purchases</text>
    <g class="small"><circle cx="593" cy="309" r="4" fill="#5b97cd"/><text x="603" y="313">Direct home</text><circle cx="719" cy="309" r="4" fill="#9670c5"/><text x="729" y="313">EV input (AC)</text><circle cx="862" cy="309" r="4" fill="#389c79"/><text x="872" y="313">Battery input (AC)</text></g>
    <g class="small">
      <text x="598" y="346" class="muted">Window</text><text x="750" y="346" class="muted">Quantity</text><text x="885" y="346" class="muted">EUR/kWh</text><text x="1067" y="346" text-anchor="end" class="muted">Cost</text>
      <text x="598" y="378">14:00-14:30</text><text x="750" y="378">0.8 kWh</text><text x="885" y="378">0.310</text><text x="1067" y="378" text-anchor="end">EUR 0.25</text>
      <rect x="588" y="396" width="494" height="58" rx="8" fill="#edf7f3"/>
      <text x="598" y="419" class="label">00:00-01:30</text><text x="750" y="419" class="label">9.1 kWh</text><text x="885" y="419">0.145</text><text x="1067" y="419" text-anchor="end">EUR 1.32</text>
      <rect x="750" y="433" width="8" height="5" fill="#5b97cd"/><rect x="758" y="433" width="66" height="5" fill="#9670c5"/><rect x="824" y="433" width="26" height="5" fill="#389c79"/>
      <text x="598" y="482">04:00-05:00</text><text x="750" y="482">2.2 kWh</text><text x="885" y="482">0.170</text><text x="1067" y="482" text-anchor="end">EUR 0.37</text>
    </g>
    <rect x="588" y="507" width="494" height="114" rx="12" fill="#f5f7f9"/>
    <text x="603" y="532" class="label">Selected window / 00:00-01:30</text><text x="603" y="556">Combine EV input with a modest storage top-up.</text>
    <text x="603" y="582" class="small">Home 0.7 kWh / EV 6.0 kWh / Battery AC 2.4 kWh</text>
    <text x="603" y="604" class="muted small">Charge efficiency 94% / supplied battery target 57%</text>
    <text x="588" y="657" class="heading">How consumers fit the plan</text>
    <rect x="588" y="674" width="240" height="108" rx="10" fill="#f5f7f9"/><text x="602" y="697" class="label">Heat pump</text><text x="602" y="727" class="value">7.8 kWh</text><text x="602" y="755" class="muted small">Supplied household forecast</text>
    <rect x="842" y="674" width="240" height="108" rx="10" fill="#f5f7f9"/><text x="856" y="697" class="label">EV charger</text><text x="856" y="727" class="value">8.2 kWh</text><text x="856" y="755" class="muted small">Supplied charging forecast</text>
  </g>
  <text x="24" y="831" class="muted small">Invented values only. Forecasts are not added to measured totals. No personal entities, addresses or live connections.</text>
</svg>
