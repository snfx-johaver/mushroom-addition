  <text x="69" y="214" fill="#26323c" font-family="Arial, sans-serif" font-size="12" font-weight="700">3 sample intervals</text>
  <text x="69" y="236" fill="#647386" font-family="Arial, sans-serif" font-size="12">Example payload from an existing placeholder entity.</text>
  <text x="69" y="258" fill="#168879" font-family="Arial, sans-serif" font-size="11">› Source</text>
  <text x="112" y="258" fill="#647386" font-family="Arial, sans-serif" font-size="10">sensor.example_schedule</text>
  <circle cx="52" cy="291" r="4" fill="#168879"/>
  <text x="69" y="295" fill="#738092" font-family="Arial, sans-serif" font-size="11">10:25</text>
  <rect x="109" y="281" width="107" height="19" rx="5" fill="#e5f3f0"/>
  <path d="M116 285v11h10m-8-4 2-3 2 1 4-4" fill="none" stroke="#167e72" stroke-width="1.1"/>
  <text x="130" y="295" fill="#167e72" font-family="Arial, sans-serif" font-size="10" font-weight="700">Measurement</text>
  <text x="69" y="320" fill="#26323c" font-family="Arial, sans-serif" font-size="13" font-weight="700">Sample reading received</text>
  <text x="69" y="341" fill="#26323c" font-family="Arial, sans-serif" font-size="12" font-weight="700">12.4 example units</text>
  <text x="69" y="363" fill="#647386" font-family="Arial, sans-serif" font-size="12">Synthetic measurement text for this illustration.</text>
  <text x="69" y="385" fill="#168879" font-family="Arial, sans-serif" font-size="11">› Source</text>
  <text x="112" y="385" fill="#647386" font-family="Arial, sans-serif" font-size="10">sensor.example_reading</text>
  <line x1="38" y1="420" x2="682" y2="420" stroke="#dce1e7"/>
  <text x="38" y="443" fill="#647386" font-family="Arial, sans-serif" font-size="11">Synthetic preview only. Entries are mapped from existing entity data;</text>
  <text x="38" y="460" fill="#647386" font-family="Arial, sans-serif" font-size="11">Filter icons are editable in Features; the card does not record or control devices.</text>
</svg>
