    <rect x="200" y="82" width="117" height="25" rx="13" fill="#e5f3f0"/><text x="227" y="98" fill="#167e72">Measurement</text>
    <path d="M210 89v12h12m-10-4 3-4 3 2 4-5" fill="none" stroke="#167e72" stroke-width="1.2"/>
    <rect x="323" y="82" width="107" height="25" rx="13" fill="#f4eee3"/><text x="350" y="98" fill="#9a702c">Availability</text>
    <g fill="none" stroke="#9a702c" stroke-width="1.2"><circle cx="340" cy="95" r="6"/><path d="m337 95 2 2 4-4"/></g>
  </g>
  <text x="38" y="132" fill="#657386" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".5">15 APRIL 2026 · NEWEST FIRST · EUROPE/AMSTERDAM</text>
  <line x1="52" y1="151" x2="52" y2="423" stroke="#d7dde4"/>
  <circle cx="52" cy="164" r="4" fill="#7953a8"/>
  <text x="69" y="168" fill="#738092" font-family="Arial, sans-serif" font-size="11">12:15</text>
  <rect x="109" y="154" width="91" height="19" rx="5" fill="#f2eafb"/>
  <g fill="none" stroke="#7953a8" stroke-width="1.1"><rect x="116" y="158" width="8" height="11" rx="1"/><path d="M118 157h4v3h-4zM118 163h4m-4 3h4"/></g>
  <text x="130" y="168" fill="#7953a8" font-family="Arial, sans-serif" font-size="10" font-weight="700">Planning</text>
