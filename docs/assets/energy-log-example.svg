<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title description">
  <title id="title">Energy Log synthetic example</title>
  <desc id="description">Synthetic Energy Log with UI-configurable icons for All, Planning, Measurement and Availability filters and matching category badges. No live data.</desc>
  <rect width="720" height="510" fill="#f1f3f6"/>
  <rect x="18" y="16" width="684" height="478" rx="18" fill="#fff" stroke="#dce1e7"/>
  <circle cx="48" cy="48" r="13" fill="#e1f3ef"/>
  <path d="M47 40l-4 9h5l-1 7 6-10h-5l2-6z" fill="#168879"/>
  <text x="73" y="47" fill="#25313c" font-family="Arial, sans-serif" font-size="16" font-weight="700">Energy Log</text>
  <text x="73" y="65" fill="#647386" font-family="Arial, sans-serif" font-size="12">Synthetic activity from placeholder entities</text>
  <g font-family="Arial, sans-serif" font-size="11">
    <rect x="38" y="82" width="59" height="25" rx="13" fill="#dff2ed"/><text x="65" y="98" fill="#267b6f">All</text>
    <g fill="none" stroke="#267b6f" stroke-width="1.2"><rect x="48" y="89" width="4" height="4"/><rect x="55" y="89" width="4" height="4"/><rect x="48" y="96" width="4" height="4"/><rect x="55" y="96" width="4" height="4"/></g>
    <rect x="103" y="82" width="91" height="25" rx="13" fill="#f2eafb"/><text x="130" y="98" fill="#7953a8">Planning</text>
