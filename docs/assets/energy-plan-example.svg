<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Energy Plan synthetic example</title>
  <desc id="description">Illustration of supplied price, solar, battery, grid and household forecasts on a shared 24-hour timeline, with summary metrics and period notes. Invented data, not a Home Assistant screenshot or an executable schedule.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #25313c; font-size: 12px; }
      .muted { fill: #647386; } .small { font-size: 11px; }
      .heading { font-size: 18px; font-weight: 700; } .value { font-size: 21px; font-weight: 700; }
      .line { stroke: #e3e8ed; fill: none; } .label { font-weight: 700; }
    </style>
  </defs>
  <rect width="960" height="720" fill="#f1f3f6"/>
  <rect x="18" y="16" width="924" height="688" rx="18" fill="#fff" stroke="#dce1e7"/>
  <circle cx="53" cy="50" r="20" fill="#e1f3ef"/>
  <g stroke="#168879" stroke-width="2" fill="none"><rect x="43" y="41" width="20" height="19" rx="3"/><path d="M43 47h20m-15-9v7m10-7v7m-11 8h5m-5 4h10"/></g>
  <text x="84" y="47" class="heading">Energy Plan</text>
  <text x="84" y="67" class="muted">Synthetic forecast - no device control</text>
  <rect x="38" y="88" width="884" height="65" rx="12" fill="#edf7f3"/>
  <text x="54" y="111" class="label">Let the sunshine do the work</text>
  <text x="54" y="134" class="muted">Store the midday surplus. Use the supplied battery plan during the evening peak.</text>
  <g>
    <rect x="38" y="166" width="212" height="72" rx="12" fill="#fff7df"/><text x="52" y="188" class="muted">Solar forecast</text><text x="52" y="218" class="value">18.6 kWh</text>
    <rect x="262" y="166" width="212" height="72" rx="12" fill="#f2eafb"/><text x="276" y="188" class="muted">Grid import</text><text x="276" y="218" class="value">7.2 kWh</text>
    <rect x="486" y="166" width="212" height="72" rx="12" fill="#e9f4fa"/><text x="500" y="188" class="muted">Import cost</text><text x="500" y="218" class="value">EUR 1.24</text>
    <rect x="710" y="166" width="212" height="72" rx="12" fill="#edf7f3"/><text x="724" y="188" class="muted">Battery at end</text><text x="724" y="218" class="value">54%</text>
  </g>
  <text x="38" y="269" class="label">Forecast timeline</text><text x="922" y="269" class="muted small" text-anchor="end">24 hours / supplied intervals</text>
  <g class="line"><path d="M180 292v258m180-258v258m180-258v258m180-258v258m180-258v258"/><path d="M180 333h720m-720 43h720m-720 43h720m-720 43h720m-720 43h720"/></g>
  <g class="muted small"><text x="180" y="289">08:00</text><text x="360" y="289">14:00</text><text x="540" y="289">20:00</text><text x="720" y="289">02:00</text><text x="900" y="289" text-anchor="end">08:00</text></g>
  <g>
    <text x="48" y="320">Electricity price</text><rect x="180" y="302" width="90" height="24" rx="4" fill="#e8dbf5"/><rect x="270" y="302" width="180" height="24" rx="4" fill="#c6e8d8"/><rect x="450" y="302" width="150" height="24" rx="4" fill="#f9d5a5"/><rect x="600" y="302" width="90" height="24" rx="4" fill="#e8dbf5"/><rect x="690" y="302" width="120" height="24" rx="4" fill="#b4dfcf"/><rect x="810" y="302" width="90" height="24" rx="4" fill="#e8dbf5"/>
    <g class="small"><text x="202" y="318">0.25</text><text x="342" y="318">0.18</text><text x="507" y="318">0.36</text><text x="626" y="318">0.25</text><text x="733" y="318">0.13</text><text x="835" y="318">0.25</text></g>
    <text x="48" y="363">Solar forecast</text><path d="M180 369L180 366L210 354L240 346L270 340L300 338L330 341L360 349L390 358L420 367L450 369H900Z" fill="#f5d774"/>
    <text x="48" y="406">Battery power</text><rect x="240" y="387" width="180" height="24" rx="4" fill="#b4dfcf"/><rect x="450" y="387" width="180" height="24" rx="4" fill="#bed6f9"/><rect x="690" y="387" width="90" height="24" rx="4" fill="#b4dfcf"/>
    <g class="small"><text x="296" y="403">Charge</text><text x="505" y="403">Discharge</text><text x="715" y="403">Charge</text></g>
    <text x="48" y="449">Battery level</text><path d="M180 452L240 445L300 434L360 429L420 429L480 438L540 446L600 451L660 451L720 442L780 436L840 439L900 443" fill="none" stroke="#389c79" stroke-width="3"/>
    <text x="48" y="492">Grid exchange</text><path d="M180 487h60v9h180v-6h30v-10h90v10h150v-12h90v12h120" fill="none" stroke="#9272bc" stroke-width="3"/>
    <text x="48" y="535">Heat pump</text><rect x="180" y="518" width="45" height="24" rx="4" fill="#f6c68b"/><rect x="480" y="518" width="30" height="24" rx="4" fill="#f6c68b"/>
  </g>
  <g>
    <rect x="38" y="568" width="436" height="74" rx="12" fill="#f5f7f9"/><text x="54" y="591" class="label">Daytime / 08:00-18:00</text><text x="54" y="614" class="muted">Solar covers the home first; surplus tops up storage.</text>
    <rect x="486" y="568" width="436" height="74" rx="12" fill="#f5f7f9"/><text x="502" y="591" class="label">Evening and overnight / 18:00-08:00</text><text x="502" y="614" class="muted">Discharge at the peak, then use a low-price window.</text>
  </g>
  <text x="38" y="675" class="muted small">Synthetic illustration, not a live screenshot. Example EUR/kWh prices and forecasts; no home data.</text>
</svg>
