name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: node --import tsx scripts/check-nas-bundle.ts
      - run: git diff --exit-code -- dist/mushroom-cards-addition.js
      - uses: actions/upload-artifact@v7
        with:
          name: mushroom-addition
          path: |
            dist/mushroom-cards-addition.js
            dist/mushroom-cards-addition.js.map

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin

  market-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install backend test dependencies
        run: >
          python -c "import json, subprocess, sys;
          requirements = json.load(open('custom_components/mushroom_addition_market/manifest.json'))['requirements'];
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pytest==9.0.0', 'voluptuous==0.15.2', *requirements])"
      - run: python -m pytest -q tests/test_market_backend.py

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
